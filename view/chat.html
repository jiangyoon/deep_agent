<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>对话 - Agent 工作台</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/vue@3.4.38/dist/vue.global.prod.js"></script>
  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
    .animate-spin { animation: spin 1s linear infinite; }
    .animate-pulse { animation: pulse 1.5s ease-in-out infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .animate-ping {
      animation: ping 1s cubic-bezier(0, 0, 0.2, 1) infinite;
    }
    @keyframes ping {
      75%, 100% { transform: scale(2); opacity: 0; }
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="app"></div>

  <script src="shared.js"></script>
  <script>
    // ------------------------------------------------------------
    // 思考过程组件
    // 用法：<execution-steps :steps="msg.steps" :is-generating="true" />
    // ------------------------------------------------------------
    const ExecutionSteps = {
      components: { IconBrain, IconLoader, IconChevronDown, IconChevronRight },
      props: {
        steps: { type: Array, default: function () { return []; } },
        isGenerating: { type: Boolean, default: false },
      },
      setup() {
        const isExpanded = ref(true);
        return { isExpanded };
      },
      template: `
        <div
          v-if="steps && steps.length"
          class="mb-4 bg-gray-50/80 border border-gray-200 rounded-2xl overflow-hidden transition-all duration-300 w-full max-w-2xl shadow-sm"
        >
          <div
            class="flex items-center justify-between px-4 py-3 cursor-pointer hover:bg-gray-100/80 transition-colors"
            @click="isExpanded = !isExpanded"
          >
            <div class="flex items-center space-x-2 text-sm font-medium text-gray-700">
              <icon-brain class="w-4 h-4 text-violet-600" />
              <span>Agent 思考过程</span>
              <icon-loader v-if="isGenerating" class="w-3.5 h-3.5 animate-spin ml-2 text-gray-400" />
            </div>
            <icon-chevron-down v-if="isExpanded" class="w-4 h-4 text-gray-400" />
            <icon-chevron-right v-else class="w-4 h-4 text-gray-400" />
          </div>

          <div v-if="isExpanded" class="px-4 pb-4 pt-1 border-t border-gray-100/80 space-y-3">
            <div v-for="(step, idx) in steps" :key="idx" class="flex items-start space-x-3 text-sm">
              <div class="mt-0.5">
                <div
                  v-if="step.status === 'completed'"
                  class="w-4 h-4 rounded-full bg-emerald-100 flex items-center justify-center"
                >
                  <div class="w-1.5 h-1.5 rounded-full bg-emerald-500"></div>
                </div>
                <div
                  v-else-if="step.status === 'error'"
                  class="w-4 h-4 rounded-full bg-rose-100 flex items-center justify-center"
                >
                  <div class="w-1.5 h-1.5 rounded-full bg-rose-500"></div>
                </div>
                <icon-loader v-else class="w-4 h-4 animate-spin text-violet-500" />
              </div>
              <div class="flex-1">
                <span
                  class="font-medium"
                  :class="step.status === 'completed' ? 'text-gray-600' : 'text-gray-900'"
                >
                  {{ step.action }}
                </span>
                <p
                  v-if="step.detail"
                  class="text-gray-500 text-xs mt-1 font-mono bg-white border border-gray-100 p-2 rounded-lg shadow-sm"
                >
                  {{ step.detail }}
                </p>
              </div>
            </div>
          </div>
        </div>
      `,
    };

    // ------------------------------------------------------------
    // 主聊天界面（无历史假数据、无模拟回复）
    // ------------------------------------------------------------
    const ChatInterface = {
      components: {
        ExecutionSteps,
        IconBrain,
        IconPlus,
        IconMessage,
        IconDatabase,
        IconLogOut,
        IconUser,
        IconSend,
        IconSquare,
      },
      setup() {
        const messages = ref([]);       // 空列表，等真实接口填充
        const sessions = ref([]);       // 空列表，等真实会话列表
        const inputValue = ref('');
        const isGenerating = ref(false);
        const textareaRef = ref(null);
        const messagesEndRef = ref(null);

        const lastMessageId = computed(function () {
          const list = messages.value;
          return list.length ? list[list.length - 1].id : null;
        });

        function scrollToBottom() {
          nextTick(function () {
            if (messagesEndRef.value) {
              messagesEndRef.value.scrollIntoView({ behavior: 'smooth' });
            }
          });
        }

        watch(messages, scrollToBottom, { deep: true });

        function handleInput() {
          nextTick(function () {
            const el = textareaRef.value;
            if (!el) return;
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 200) + 'px';
          });
        }

        function handleKeyDown(e) {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            handleSend();
          }
        }

        function contentBlocks(content) {
          return content.split('```').map(function (block, i) {
            if (i % 2 !== 0) {
              return { type: 'code', text: block.replace(/^[a-z]+\n/, '') };
            }
            return { type: 'text', text: block };
          });
        }

        // 只把用户消息放进列表；Agent 回复留给以后接真实后端
        function handleSend() {
          const text = inputValue.value.trim();
          if (!text || isGenerating.value) return;

          messages.value = messages.value.concat([
            { id: Date.now(), role: 'user', content: text },
          ]);
          inputValue.value = '';
          if (textareaRef.value) {
            textareaRef.value.style.height = 'auto';
          }

          // TODO: 在这里调用真实 Agent 接口，把返回写入 messages
        }

        function stopGeneration() {
          isGenerating.value = false;
          // TODO: 在这里取消真实流式请求
        }

        function newSession() {
          messages.value = [];
          isGenerating.value = false;
        }

        return {
          messages,
          sessions,
          inputValue,
          isGenerating,
          textareaRef,
          messagesEndRef,
          lastMessageId,
          handleInput,
          handleKeyDown,
          handleSend,
          stopGeneration,
          newSession,
          contentBlocks,
        };
      },
      template: `
        <div class="flex h-screen bg-gray-50 text-gray-900 overflow-hidden font-sans">
          <!-- 侧边栏 -->
          <div class="w-[280px] bg-white border-r border-gray-200 flex-col hidden md:flex transition-all text-gray-700 z-20">
            <div class="p-5">
              <button
                @click="newSession"
                class="w-full flex items-center justify-center gap-2 bg-violet-600 text-white px-4 py-3 rounded-xl hover:bg-violet-500 transition-all shadow-[0_4px_14px_rgba(124,58,237,0.25)] font-medium"
              >
                <icon-plus class="w-5 h-5" />
                新建会话
              </button>
            </div>

            <div class="flex-1 overflow-y-auto px-3 py-2 space-y-1">
              <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3 px-3 mt-2">历史会话</h3>
              <p v-if="!sessions.length" class="px-3 text-sm text-gray-400">暂无会话</p>
              <button
                v-for="chat in sessions"
                :key="chat.id"
                class="w-full text-left flex items-center gap-3 px-3 py-3 rounded-xl hover:bg-violet-50 text-sm transition-colors group text-gray-600"
              >
                <icon-message class="w-4 h-4 text-gray-400 group-hover:text-violet-600 transition-colors" />
                <span class="truncate group-hover:text-violet-900 font-medium transition-colors">{{ chat.title }}</span>
              </button>
            </div>

            <div class="p-4 border-t border-gray-100 space-y-1">
              <button class="w-full flex items-center gap-3 px-3 py-3 rounded-xl hover:bg-violet-50 text-sm transition-colors group text-gray-600">
                <icon-database class="w-4 h-4 text-gray-400 group-hover:text-violet-600 transition-colors" />
                <span class="font-medium group-hover:text-violet-900 transition-colors">记忆查看区</span>
              </button>
              <button
                type="button"
                class="w-full flex items-center gap-3 px-3 py-3 rounded-xl hover:bg-rose-50 text-gray-500 hover:text-rose-600 text-sm transition-colors group"
              >
                <icon-log-out class="w-4 h-4 group-hover:text-rose-600 transition-colors" />
                <span class="font-medium">退出登录</span>
              </button>
            </div>
          </div>

          <!-- 主聊天区 -->
          <div class="flex-1 flex flex-col h-full bg-gray-50 relative">
            <header class="h-16 border-b border-gray-200 flex items-center px-8 justify-between bg-white/60 backdrop-blur-md z-10">
              <div class="flex items-center gap-3">
                <div class="relative flex h-2.5 w-2.5">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
                </div>
                <span class="font-semibold text-gray-800 text-sm tracking-wide">Agent 工作台</span>
              </div>
              <div class="text-xs text-violet-700 bg-violet-50 border border-violet-100 px-3 py-1.5 rounded-full font-medium shadow-sm">
                模型: Agent-Pro-V1
              </div>
            </header>

            <div class="flex-1 overflow-y-auto p-4 sm:p-8 pb-40">
              <div class="max-w-4xl mx-auto space-y-8">
                <div v-if="!messages.length" class="text-center text-gray-400 text-sm pt-24">
                  输入问题开始对话
                </div>

                <div
                  v-for="msg in messages"
                  :key="msg.id"
                  class="flex"
                  :class="msg.role === 'user' ? 'justify-end' : 'justify-start'"
                >
                  <div
                    class="flex gap-4 max-w-[85%]"
                    :class="msg.role === 'user' ? 'flex-row-reverse' : ''"
                  >
                    <div class="flex-shrink-0 mt-1">
                      <div
                        v-if="msg.role === 'user'"
                        class="w-10 h-10 rounded-full bg-white border border-gray-200 flex items-center justify-center text-gray-500 shadow-sm"
                      >
                        <icon-user class="w-5 h-5" />
                      </div>
                      <div
                        v-else
                        class="w-10 h-10 rounded-2xl bg-gradient-to-br from-violet-600 to-indigo-600 shadow-md flex items-center justify-center text-white"
                      >
                        <icon-brain class="w-6 h-6" />
                      </div>
                    </div>

                    <div
                      class="flex flex-col"
                      :class="msg.role === 'user' ? 'items-end' : 'items-start'"
                    >
                      <execution-steps
                        v-if="msg.role === 'agent' && msg.steps && msg.steps.length"
                        :steps="msg.steps"
                        :is-generating="isGenerating && msg.id === lastMessageId"
                      />

                      <div
                        v-if="msg.content"
                        class="px-6 py-4 rounded-[1.5rem] shadow-sm"
                        :class="msg.role === 'user'
                          ? 'bg-violet-600 text-white rounded-tr-sm shadow-violet-200'
                          : 'bg-white border border-gray-200 text-gray-800 rounded-tl-sm'"
                      >
                        <div class="whitespace-pre-wrap leading-relaxed text-[15px]">
                          <template v-for="(block, i) in contentBlocks(msg.content)" :key="i">
                            <div
                              v-if="block.type === 'code'"
                              class="my-4 rounded-xl overflow-hidden shadow-inner border border-gray-800"
                            >
                              <div class="bg-gray-800 text-gray-400 text-xs px-4 py-1.5 flex justify-between items-center">
                                <span>Code</span>
                              </div>
                              <pre class="bg-gray-900 text-gray-50 p-4 overflow-x-auto text-sm font-mono leading-relaxed"><code>{{ block.text }}</code></pre>
                            </div>
                            <span v-else>{{ block.text }}</span>
                          </template>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
                <div ref="messagesEndRef"></div>
              </div>
            </div>

            <div class="absolute bottom-0 w-full bg-gradient-to-t from-gray-50 via-gray-50 to-transparent pt-12 pb-6 px-4">
              <div class="max-w-4xl mx-auto relative flex flex-col items-center">
                <button
                  v-if="isGenerating"
                  @click="stopGeneration"
                  class="mb-4 flex items-center gap-2 bg-white border border-gray-200 shadow-md text-gray-600 hover:text-rose-600 hover:border-rose-200 px-5 py-2 rounded-full text-sm font-medium transition-all transform hover:scale-105"
                >
                  <icon-square class="w-4 h-4 fill-current" />
                  停止生成
                </button>

                <div class="w-full relative flex items-end bg-white border border-gray-300 rounded-[1.5rem] shadow-lg focus-within:ring-4 focus-within:ring-violet-500/20 focus-within:border-violet-500 transition-all duration-300 overflow-hidden">
                  <textarea
                    ref="textareaRef"
                    v-model="inputValue"
                    @input="handleInput"
                    @keydown="handleKeyDown"
                    placeholder="输入问题，让 Agent 为您分析、编程或检索数据... (Shift+Enter 换行)"
                    class="w-full max-h-[240px] min-h-[60px] py-4 pl-6 pr-14 bg-transparent resize-none outline-none text-[15px] leading-relaxed text-gray-800 placeholder:text-gray-400"
                    rows="1"
                  ></textarea>
                  <div class="absolute right-3 bottom-2.5">
                    <button
                      @click="handleSend"
                      :disabled="!inputValue.trim() || isGenerating"
                      class="p-2.5 rounded-xl flex items-center justify-center transition-all duration-200"
                      :class="inputValue.trim() && !isGenerating
                        ? 'bg-violet-600 text-white shadow-md shadow-violet-200 hover:bg-violet-700 hover:scale-105'
                        : 'bg-gray-100 text-gray-400 cursor-not-allowed'"
                    >
                      <icon-send class="w-5 h-5" />
                    </button>
                  </div>
                </div>
                <div class="text-xs text-gray-400 mt-3 flex items-center gap-1.5">
                  <icon-brain class="w-3 h-3" />
                  Agent 可能会犯错。请核实关键信息。
                </div>
              </div>
            </div>
          </div>
        </div>
      `,
    };

    createApp({
      components: { ChatInterface },
      template: `<chat-interface />`,
    }).mount('#app');
  </script>
</body>
</html>
