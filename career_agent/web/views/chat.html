<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>对话 - 证书与职称咨询</title>
  <script src="/vendor/tailwind-browser.js?v=1"></script>
  <script src="/vendor/vue.global.prod.js?v=1"></script>
  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
    .animate-spin { animation: spin 1s linear infinite; }
    .animate-pulse { animation: pulse 1.5s ease-in-out infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .animate-ping {
      animation: ping 1s cubic-bezier(0, 0, 0.2, 1) infinite;
    }
    @keyframes ping {
      75%, 100% { transform: scale(2); opacity: 0; }
    }
    .md-answer > :first-child { margin-top: 0; }
    .md-answer > :last-child { margin-bottom: 0; }
    .md-answer p { margin: 0.6em 0; }
    .md-answer h1, .md-answer h2, .md-answer h3 { font-weight: 600; margin: 0.8em 0 0.4em; line-height: 1.35; }
    .md-answer h1 { font-size: 1.25rem; }
    .md-answer h2 { font-size: 1.1rem; }
    .md-answer h3 { font-size: 1rem; }
    .md-answer ul, .md-answer ol { margin: 0.5em 0; padding-left: 1.3em; }
    .md-answer ul { list-style: disc; }
    .md-answer ol { list-style: decimal; }
    .md-answer li { margin: 0.2em 0; }
    .md-answer a { color: #6d28d9; text-decoration: underline; }
    .md-answer code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.9em; background: #f3f4f6; padding: 0.1em 0.35em; border-radius: 0.35rem; }
    .md-answer pre { margin: 0.8em 0; background: #111827; color: #f9fafb; padding: 0.9em 1em; border-radius: 0.75rem; overflow-x: auto; }
    .md-answer pre code { background: transparent; color: inherit; padding: 0; }
    .md-answer blockquote { margin: 0.6em 0; padding-left: 0.8em; border-left: 3px solid #ddd6fe; color: #4b5563; }
    .md-answer table { border-collapse: collapse; margin: 0.8em 0; width: 100%; font-size: 0.92em; }
    .md-answer th, .md-answer td { border: 1px solid #e5e7eb; padding: 0.4em 0.6em; text-align: left; vertical-align: top; }
    .md-answer th { background: #f9fafb; }
    .activity-card { width: 100%; min-width: 0; border: 1px solid #e5e7eb; border-radius: 12px; background: white; overflow: hidden; }
    .activity-heading { display: flex; gap: .65rem; align-items: center; padding: .6rem .85rem; width: 100%; min-width: 0; color: #475569; font-size: .875rem; cursor: pointer; }
    .activity-heading:hover { background: #f8fafc; }
    .activity-heading:focus-visible { outline: 2px solid #8b5cf6; outline-offset: -2px; }
    .step-dot { width: .5rem; height: .5rem; border-radius: 50%; background: #8795a4; flex: none; }
    .step-dot.failed { background: #ce6545; }
    .activity-detail { border-top: 1px solid #e5e7eb; max-height: 15rem; overflow: auto; overscroll-behavior: contain; padding: .7rem .85rem; font-size: .85rem; line-height: 1.6; color: #475569; overflow-wrap: anywhere; }
    .activity-detail pre { white-space: pre-wrap; margin: .35rem 0; }
    .thought-detail { height: min(160px, 25vh); }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="app"></div>

  <!-- ?v= 用来打破浏览器对旧 shared.js 的缓存；改了图标就往上加一版 -->
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
  <script src="/shared.js?v=3"></script>
  <script src="/chat-activity.js"></script>
  <script>
    // 主聊天界面（无历史假数据、无模拟回复）
    // ------------------------------------------------------------
    const ChatInterface = {
      components: {
        AgentBlocks,
        IconBrain,
        IconPlus,
        IconMessage,
        IconDatabase,
        IconLogOut,
        IconUser,
        IconSend,
        IconSquare,
        IconTrash,
      },
      setup() {
        const messages = ref([]);
        const currentUser = ref(null);
        const isLoggingOut = ref(false);
        const memoryVisible = ref(false);
        const memoryLoading = ref(false);
        const memorySaving = ref(false);
        const memoryLoaded = ref(false);
        const memoryEditing = ref(false);
        const memoryContent = ref('');
        const memoryDraft = ref('');
        const memoryRevision = ref('');
        const memoryUpdatedAt = ref(null);
        const memoryError = ref('');
        const memoryNotice = ref('');
        const memoryDialogRef = ref(null);
        const sessions = ref([]);
        const currentSessionId = ref(null);
        // 模型上下文窗口（仪表盘分母），登录后从 /api/context-config 拉取，不再写死
        const knownLimitTokens = ref(0);
        const contextUsage = ref({
          used_tokens: 0,
          limit_tokens: 0,
          percent: 0,
        });
        const sessionError = ref('');
        const inputValue = ref('');
        const isGenerating = ref(false);
        const textareaRef = ref(null);
        const messagesEndRef = ref(null);
        // 真正滚动的是这个 overflow 容器，不是整页 window
        const messagesScrollRef = ref(null);

        const lastMessageId = computed(function () {
          const list = messages.value;
          return list.length ? list[list.length - 1].id : null;
        });

        const contextPercent = computed(function () {
          const percent = Number(contextUsage.value.percent || 0);
          return Math.max(0, Math.min(percent, 100));
        });

        const contextRingStyle = computed(function () {
          const percent = contextPercent.value;
          const color = percent >= 85
            ? '#e11d48'
            : percent >= 65
              ? '#d97706'
              : '#7c3aed';
          return {
            background: 'conic-gradient('
              + color
              + ' '
              + percent
              + '%, #e5e7eb '
              + percent
              + '% 100%)',
          };
        });

        function compactTokens(value) {
          const tokens = Number(value || 0);
          if (tokens >= 1000) {
            return (tokens / 1000).toFixed(tokens >= 10000 ? 0 : 1) + 'K';
          }
          return String(tokens);
        }

        function resetContextUsage() {
          contextUsage.value = {
            used_tokens: 0,
            limit_tokens: knownLimitTokens.value,
            percent: 0,
          };
        }

        // 新片段只在跟随状态下滚动。展开详情和普通 Vue 状态更新不会触发跟随。
        const following = ref(true);
        let frame = 0;
        let lastScrollTop = 0;
        function followOutput() {
          if (!following.value || frame) return;
          frame = requestAnimationFrame(() => {
            frame = 0;
            const el = messagesScrollRef.value;
            if (el && following.value) {
              el.scrollTop = el.scrollHeight;
              lastScrollTop = el.scrollTop;
            }
          });
        }
        function goLatest() {
          following.value = true;
          followOutput();
        }
        function onMessageWheel(event) {
          if (event.deltaY < 0 && !event.target.closest('.activity-detail')) following.value = false;
        }
        function onMessageScroll(event) {
          const el = event.currentTarget;
          const atBottom = el.scrollHeight - el.clientHeight - el.scrollTop <= 4;
          if (!atBottom && el.scrollTop < lastScrollTop - 1) following.value = false;
          if (el.scrollTop > lastScrollTop && atBottom) {
            following.value = true;
          }
          lastScrollTop = el.scrollTop;
        }
        function inspectStep(button) {
          following.value = false;
          const top = button.getBoundingClientRect().top;
          nextTick(() => {
            if (!button.isConnected) return;
            const el = messagesScrollRef.value;
            el.scrollTop += button.getBoundingClientRect().top - top;
            lastScrollTop = el.scrollTop;
          });
        }

        function handleInput() {
          nextTick(function () {
            const el = textareaRef.value;
            if (!el) return;
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 200) + 'px';
          });
        }

        function handleKeyDown(e) {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            handleSend();
          }
        }

        const markdownReady = typeof marked !== 'undefined' && typeof DOMPurify !== 'undefined';
        if (markdownReady) {
          DOMPurify.addHook('afterSanitizeAttributes', function (node) {
            if (node.tagName === 'A') {
              node.setAttribute('target', '_blank');
              node.setAttribute('rel', 'noopener noreferrer');
            }
          });
        }

        function renderMarkdown(content) {
          if (!markdownReady) {
            return '';
          }
          return DOMPurify.sanitize(marked.parse(content, { gfm: true }));
        }

        let activeRequest = null;

        async function responseJson(response) {
          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.detail || '请求失败');
          }
          return data;
        }

        async function loadSessions() {
          try {
            const response = await apiFetch('/api/sessions');
            sessions.value = await responseJson(response);
            sessionError.value = '';
          } catch (error) {
            sessionError.value = '会话列表加载失败：' + error.message;
          }
        }

        async function newSession() {
          if (activeRequest) {
            activeRequest.abort();
          }

          try {
            const response = await apiFetch('/api/sessions', {
              method: 'POST',
            });
            const session = await responseJson(response);
            currentSessionId.value = session.id;
            messages.value = [];
            resetContextUsage();
            isGenerating.value = false;
            sessionError.value = '';
            return session.id;
          } catch (error) {
            sessionError.value = '新建会话失败：' + error.message;
            return null;
          }
        }

        async function openSession(sessionId) {
          if (activeRequest) {
            activeRequest.abort();
          }

          try {
            const response = await apiFetch(
              '/api/sessions/' + encodeURIComponent(sessionId)
            );
            const session = await responseJson(response);
            messages.value = session.messages.map(function (message, index) {
              return {
                id: 'history-' + index,
                role: message.role,
                content: message.content,
                blocks: replayBlocks(message),
              };
            });
            currentSessionId.value = session.id;
            contextUsage.value = session.context_usage || {
              used_tokens: 0,
              limit_tokens: knownLimitTokens.value,
              percent: 0,
            };
            isGenerating.value = false;
            sessionError.value = '';
            // 进入已有会话：立刻滚到最新消息，不要停在顶部
            goLatest();
          } catch (error) {
            sessionError.value = '会话加载失败：' + error.message;
          }
        }

        async function removeSession(sessionId) {
          const confirmed = window.confirm('确认删除这个会话？');
          if (!confirmed) return;

          try {
            const response = await apiFetch(
              '/api/sessions/' + encodeURIComponent(sessionId),
              { method: 'DELETE' }
            );
            if (!response.ok) {
              const data = await response.json();
              throw new Error(data.detail || '删除失败');
            }

            if (currentSessionId.value === sessionId) {
              currentSessionId.value = null;
              messages.value = [];
              resetContextUsage();
            }
            await loadSessions();
          } catch (error) {
            sessionError.value = '会话删除失败：' + error.message;
          }
        }

        function parseSseBlock(block) {
          let eventName = 'message';
          const dataLines = [];

          block.split('\n').forEach(function (line) {
            if (line.startsWith('event:')) {
              eventName = line.slice(6).trim();
            } else if (line.startsWith('data:')) {
              dataLines.push(line.slice(5).trimStart());
            }
          });

          if (!dataLines.length) return null;
          return {
            name: eventName,
            data: JSON.parse(dataLines.join('\n')),
          };
        }

        function replayBlocks(message) {
          const blocks = [];
          for (const event of message.events || []) applyChatEvent(blocks, event);
          finishChatBlocks(blocks, 'done');
          return blocks;
        }

        // 发送问题：先把用户消息和空的 Agent 气泡放进列表，
        // 再请求 /api/chat/stream，按 SSE 事件把回答一点点拼上去。
        async function handleSend() {
          const text = inputValue.value.trim();
          // 空内容，或上一轮还在生成时，直接忽略
          if (!text || isGenerating.value) return;

          let sessionId = currentSessionId.value;
          if (!sessionId) {
            sessionId = await newSession();
            if (!sessionId) return;
          }

          // 用时间戳生成一对关联 id：用户消息 + 对应的 Agent 空气泡
          const requestId = Date.now();
          messages.value = messages.value.concat([
            { id: requestId, role: 'user', content: text },
            {
              id: requestId + 1,
              role: 'agent',
              content: '',
              blocks: [],
            },
          ]);
          inputValue.value = '';
          isGenerating.value = true;
          goLatest();
          // 发送后把输入框高度收回去
          if (textareaRef.value) {
            textareaRef.value.style.height = 'auto';
          }

          // AbortController 给"停止生成"用：点停止就 abort 这次 fetch
          const controller = new AbortController();
          activeRequest = controller;

          try {
            // 会话编号放进 URL；后端会把本轮消息写入对应检查点
            const response = await apiFetch(
              '/api/sessions/'
                + encodeURIComponent(sessionId)
                + '/stream',
              {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ question: text }),
              signal: controller.signal,
              }
            );

            // HTTP 层失败（4xx/5xx）：尽量读出 FastAPI 返回的 detail
            if (!response.ok) {
              const data = await response.json();
              throw new Error(data.detail || '请求失败');
            }

            // 找到刚才预置的那条空 Agent 消息，后面往它的 content 上追加
            const agentMessage = messages.value.find(function (msg) {
              return msg.id === requestId + 1;
            });
            if (!response.body) {
              throw new Error('浏览器无法读取流式响应');
            }

            // ReadableStream：一块一块读字节；decoder 转成字符串
            // buffer 用来拼不完整的 SSE 事件（可能被拆在两次 read 之间）
            const reader = response.body.getReader();
            const decoder = new TextDecoder('utf-8');
            let buffer = '';
            let streamFinished = false;

            while (!streamFinished) {
              const result = await reader.read();
              // stream: true 表示后面可能还有字节，避免把多字节汉字截断
              buffer += decoder.decode(result.value || new Uint8Array(), {
                stream: !result.done,
              });

              // SSE 协议：每个事件以空行（\n\n）分隔
              let separatorIndex = buffer.indexOf('\n\n');
              while (separatorIndex !== -1) {
                const block = buffer.slice(0, separatorIndex);
                buffer = buffer.slice(separatorIndex + 2);
                const event = parseSseBlock(block);

                if (event && agentMessage && ['reasoning_delta', 'answer_delta', 'tool_call', 'tool_result'].includes(event.name)) {
                  applyChatEvent(agentMessage.blocks, event, Date.now());
                  followOutput();
                } else if (event && event.name === 'usage' && agentMessage) {
                  const inputTokens = Number(event.data.input_tokens || 0);
                  const outputTokens = Number(event.data.output_tokens || 0);
                  const limitTokens = Number(
                    event.data.limit_tokens
                      || contextUsage.value.limit_tokens
                      || knownLimitTokens.value
                  );
                  const usedTokens = inputTokens + outputTokens;
                  let percent = 0;
                  if (event.data.context_percent !== undefined) {
                    percent = Number(event.data.context_percent);
                  } else if (limitTokens > 0) {
                    percent = usedTokens * 100 / limitTokens;
                  }
                  contextUsage.value = {
                    used_tokens: usedTokens,
                    limit_tokens: limitTokens,
                    percent: percent,
                  };
                } else if (event && event.name === 'error') {
                  throw new Error(event.data.message || '流式请求失败');
                } else if (event && event.name === 'done') {
                  if (agentMessage) finishChatBlocks(agentMessage.blocks, 'done');
                  followOutput();
                  streamFinished = true;
                  break;
                }

                separatorIndex = buffer.indexOf('\n\n');
              }

              // 底层流已关闭（即使没收到 done 也要退出循环）
              if (result.done && !streamFinished) {
                throw new Error('连接已断开');
              }
            }
          } catch (error) {
            // 失败或用户点了停止：在 Agent 气泡里补一句说明
            const agentMessage = messages.value.find(function (msg) {
              return msg.id === requestId + 1;
            });
            if (agentMessage) {
              finishChatBlocks(agentMessage.blocks, error.name === 'AbortError' ? 'interrupted' : 'error');
              const message = error.name === 'AbortError'
                ? '已停止生成。'
                : '请求失败：' + error.message;
              applyChatEvent(agentMessage.blocks, { name: 'answer_delta', data: { text: '\n\n' + message } });
              followOutput();
            }
          } finally {
            if (activeRequest === controller) {
              activeRequest = null;
              isGenerating.value = false;
              await loadSessions();
            }
          }
        }

        function stopGeneration() {
          if (activeRequest) activeRequest.abort();
        }

        function applyMemorySnapshot(data) {
          memoryContent.value = data.content;
          memoryDraft.value = data.content;
          memoryRevision.value = data.revision;
          memoryUpdatedAt.value = data.updated_at || null;
          memoryLoaded.value = true;
          memoryEditing.value = false;
        }

        function hasMemoryChanges() {
          return memoryEditing.value && memoryDraft.value !== memoryContent.value;
        }

        async function loadMemory() {
          if (memoryLoading.value || memorySaving.value) return;
          if (hasMemoryChanges() && !window.confirm('重新加载会丢弃未保存的修改，是否继续？')) return;
          memoryLoading.value = true;
          memoryError.value = '';
          memoryNotice.value = '';
          try {
            const response = await apiFetch('/api/memory');
            applyMemorySnapshot(await responseJson(response));
          } catch (error) {
            memoryError.value = error.message;
          } finally {
            memoryLoading.value = false;
          }
        }

        async function openMemory() {
          if (memoryLoading.value || memorySaving.value) return;
          memoryVisible.value = true;
          nextTick(function () {
            if (memoryDialogRef.value && !memoryDialogRef.value.open) {
              memoryDialogRef.value.showModal();
            }
          });
          await loadMemory();
        }

        function closeMemory() {
          if (memoryLoading.value || memorySaving.value) return;
          if (hasMemoryChanges() && !window.confirm('放弃尚未保存的记忆修改？')) return;
          if (memoryDialogRef.value) memoryDialogRef.value.close();
          memoryVisible.value = false;
          memoryDraft.value = memoryContent.value;
          memoryEditing.value = false;
        }

        function editMemory() {
          if (!memoryLoaded.value || memoryLoading.value || memorySaving.value) return;
          memoryEditing.value = true;
          memoryNotice.value = '';
        }

        function cancelMemoryEdit() {
          if (memoryLoading.value || memorySaving.value) return;
          memoryDraft.value = memoryContent.value;
          memoryEditing.value = false;
          memoryError.value = '';
        }

        async function saveMemory() {
          if (!memoryLoaded.value || !memoryEditing.value || memoryLoading.value || memorySaving.value) return;
          memorySaving.value = true;
          memoryError.value = '';
          memoryNotice.value = '';
          try {
            const response = await apiFetch('/api/memory', {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ content: memoryDraft.value, revision: memoryRevision.value }),
            });
            applyMemorySnapshot(await responseJson(response));
            memoryNotice.value = '已保存。建议新建会话使用最新记忆。';
          } catch (error) {
            memoryError.value = error.message;
          } finally {
            memorySaving.value = false;
          }
        }

        async function clearMemory() {
          if (!memoryLoaded.value || memoryLoading.value || memorySaving.value) return;
          if (!window.confirm('确认清空当前账号的长期记忆？将恢复空模板并丢弃未保存修改，不会删除历史聊天。')) return;
          memorySaving.value = true;
          memoryError.value = '';
          memoryNotice.value = '';
          try {
            const response = await apiFetch('/api/memory', {
              method: 'DELETE',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ revision: memoryRevision.value }),
            });
            applyMemorySnapshot(await responseJson(response));
            memoryNotice.value = '已清空并恢复空模板。建议新建会话继续。';
          } catch (error) {
            memoryError.value = error.message;
          } finally {
            memorySaving.value = false;
          }
        }

        function memoryTime(value) {
          return value ? new Date(value).toLocaleString() : '尚未保存';
        }

        async function initialize() {
          try {
            const response = await apiFetch('/api/auth/me');
            currentUser.value = await responseJson(response);
            await loadSessions();
            // 模型上下文窗口由后端统一下发；失败不阻塞页面，只是仪表盘显示"未配置"
            try {
              const configResponse = await apiFetch('/api/context-config');
              const configData = await responseJson(configResponse);
              knownLimitTokens.value = Number(configData.limit_tokens || 0);
              if (!contextUsage.value.limit_tokens) {
                contextUsage.value.limit_tokens = knownLimitTokens.value;
              }
            } catch (configError) {
              // 拉不到就不显示分母，上下文比例保持 0
            }
          } catch (error) {
            sessionError.value = error.message;
          }
        }

        async function handleLogout() {
          if (isLoggingOut.value) return;
          isLoggingOut.value = true;
          if (activeRequest) activeRequest.abort();
          try {
            const response = await apiFetch('/api/auth/logout', { method: 'POST' });
            if (!response.ok) throw new Error('退出失败，请稍后重试');
            messages.value = [];
            sessions.value = [];
            currentUser.value = null;
            redirectToLogin(false);
          } catch (error) {
            sessionError.value = error.message;
          } finally {
            isLoggingOut.value = false;
          }
        }

        onMounted(initialize);

        return {
          messages,
          currentUser,
          isLoggingOut,
          handleLogout,
          memoryVisible,
          memoryLoading,
          memorySaving,
          memoryLoaded,
          memoryEditing,
          memoryContent,
          memoryDraft,
          memoryUpdatedAt,
          memoryError,
          memoryNotice,
          memoryDialogRef,
          openMemory,
          closeMemory,
          loadMemory,
          editMemory,
          cancelMemoryEdit,
          saveMemory,
          clearMemory,
          memoryTime,
          sessions,
          currentSessionId,
          contextUsage,
          contextPercent,
          contextRingStyle,
          sessionError,
          inputValue,
          isGenerating,
          textareaRef,
          messagesEndRef,
          messagesScrollRef, following, goLatest, onMessageScroll, onMessageWheel, inspectStep,
          lastMessageId,
          handleInput,
          handleKeyDown,
          handleSend,
          stopGeneration,
          newSession,
          openSession,
          removeSession,
          markdownReady,
          renderMarkdown,
          compactTokens,
        };
      },
      template: `
        <div class="flex h-screen bg-gray-50 text-gray-900 overflow-hidden font-sans">
          <dialog
            v-if="memoryVisible"
            ref="memoryDialogRef"
            @cancel.prevent="closeMemory"
            aria-labelledby="memory-title"
            class="m-auto max-w-3xl max-h-[90vh] rounded-2xl border-0 p-0 shadow-2xl backdrop:bg-black/40"
            style="width: calc(100% - 2rem)"
          >
            <div class="p-5 sm:p-7 space-y-4">
              <div class="flex items-center justify-between gap-4">
                <h2 id="memory-title" class="text-lg font-semibold text-gray-900">我的长期记忆</h2>
                <button @click="closeMemory" :disabled="memoryLoading || memorySaving" class="text-sm text-gray-500 disabled:opacity-40">关闭</button>
              </div>
              <p class="text-sm leading-relaxed text-gray-500">只查看和管理当前账号的记忆。修改后建议新建会话；已有会话可能仍使用原来的记忆。清空记忆不会删除历史聊天。</p>
              <p v-if="memoryError" role="alert" class="text-sm text-rose-600 whitespace-pre-wrap">{{ memoryError }}</p>
              <p v-if="memoryNotice" role="status" class="text-sm text-emerald-700">{{ memoryNotice }}</p>
              <p v-if="memoryLoading" role="status" class="text-sm text-gray-500">正在加载记忆…</p>
              <div v-if="memoryLoaded" class="space-y-2">
                <div class="flex flex-wrap justify-between gap-2 text-xs text-gray-500">
                  <label for="memory-content">{{ memoryEditing ? '编辑记忆（纯文本 / Markdown）' : '记忆内容' }}</label>
                  <span>{{ memoryDraft.length }} 字符 · 更新于 {{ memoryTime(memoryUpdatedAt) }}</span>
                </div>
                <textarea
                  id="memory-content"
                  v-model="memoryDraft"
                  :readonly="!memoryEditing"
                  :disabled="memoryLoading || memorySaving"
                  maxlength="100000"
                  rows="12"
                  placeholder="暂无记忆。点击“编辑”添加用户偏好或背景。"
                  class="w-full rounded-xl border border-gray-200 p-4 text-sm font-mono leading-relaxed outline-none focus:ring-2 focus:ring-violet-400 read-only:bg-gray-50 disabled:opacity-60"
                ></textarea>
              </div>
              <div class="flex flex-wrap items-center gap-3 text-sm">
                <button @click="loadMemory" :disabled="memoryLoading || memorySaving" class="px-3 py-2 border border-gray-200 rounded-lg disabled:opacity-40">重新加载</button>
                <button v-if="!memoryEditing" @click="editMemory" :disabled="!memoryLoaded || memoryLoading || memorySaving" class="px-3 py-2 bg-violet-600 text-white rounded-lg disabled:opacity-40">编辑</button>
                <template v-else>
                  <button @click="saveMemory" :disabled="memoryLoading || memorySaving" class="px-3 py-2 bg-violet-600 text-white rounded-lg disabled:opacity-40">{{ memorySaving ? '处理中…' : '保存' }}</button>
                  <button @click="cancelMemoryEdit" :disabled="memoryLoading || memorySaving" class="px-3 py-2 border border-gray-200 rounded-lg disabled:opacity-40">取消编辑</button>
                </template>
                <button @click="clearMemory" :disabled="!memoryLoaded || memoryLoading || memorySaving" class="ml-auto px-3 py-2 text-rose-600 border border-rose-200 rounded-lg disabled:opacity-40">清空记忆</button>
              </div>
            </div>
          </dialog>
          <!-- 侧边栏 -->
          <div class="w-[280px] bg-white border-r border-gray-200 flex-col hidden md:flex transition-all text-gray-700 z-20">
            <div class="p-5">
              <button
                @click="newSession"
                class="w-full flex items-center justify-center gap-2 bg-violet-600 text-white px-4 py-3 rounded-xl hover:bg-violet-500 transition-all shadow-[0_4px_14px_rgba(124,58,237,0.25)] font-medium"
              >
                <icon-plus class="w-5 h-5" />
                新建会话
              </button>
            </div>

            <div class="flex-1 overflow-y-auto px-3 py-2 space-y-1">
              <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3 px-3 mt-2">历史会话</h3>
              <p v-if="sessionError" class="px-3 mb-3 text-xs leading-relaxed text-rose-600">{{ sessionError }}</p>
              <p v-if="!sessions.length" class="px-3 text-sm text-gray-400">暂无会话</p>
              <div
                v-for="chat in sessions"
                :key="chat.id"
                class="flex items-center rounded-xl transition-colors group"
                :class="currentSessionId === chat.id
                  ? 'bg-violet-50 text-violet-900'
                  : 'hover:bg-violet-50 text-gray-600'"
              >
                <button
                  @click="openSession(chat.id)"
                  class="min-w-0 flex-1 text-left flex items-center gap-3 px-3 py-3 text-sm"
                >
                  <icon-message class="w-4 h-4 flex-shrink-0 text-gray-400 group-hover:text-violet-600 transition-colors" />
                  <span class="min-w-0 flex-1">
                    <span class="block truncate font-medium">{{ chat.title }}</span>
                    <span class="block mt-0.5 text-[11px] text-gray-400">{{ chat.message_count }} 条消息</span>
                  </span>
                </button>
                <button
                  @click.stop="removeSession(chat.id)"
                  class="mr-2 p-2 rounded-lg text-gray-300 hover:text-rose-600 hover:bg-rose-50 opacity-0 group-hover:opacity-100 focus:opacity-100 transition-all"
                  title="删除会话"
                  aria-label="删除会话"
                >
                  <icon-trash class="w-4 h-4" />
                </button>
              </div>
            </div>

            <div class="p-4 border-t border-gray-100 space-y-1">
              <button @click="openMemory" class="w-full flex items-center gap-3 px-3 py-3 rounded-xl hover:bg-violet-50 text-sm transition-colors group text-gray-600">
                <icon-database class="w-4 h-4 text-gray-400 group-hover:text-violet-600 transition-colors" />
                <span class="font-medium group-hover:text-violet-900 transition-colors">记忆管理</span>
              </button>
              <button
                type="button"
                @click="handleLogout"
                :disabled="isLoggingOut"
                class="w-full flex items-center gap-3 px-3 py-3 rounded-xl hover:bg-rose-50 text-gray-500 hover:text-rose-600 text-sm transition-colors group"
              >
                <icon-log-out class="w-4 h-4 group-hover:text-rose-600 transition-colors" />
                <span class="font-medium">退出登录</span>
              </button>
            </div>
          </div>

          <!-- 主聊天区 -->
          <div class="flex-1 flex flex-col h-full bg-gray-50 relative">
            <header class="h-16 border-b border-gray-200 flex items-center px-8 justify-between bg-white/60 backdrop-blur-md z-10">
              <div class="flex items-center gap-3">
                <div class="relative flex h-2.5 w-2.5">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
                </div>
                <span class="font-semibold text-gray-800 text-sm tracking-wide">证书与职称咨询</span>
              </div>
              <div class="flex items-center gap-3 text-xs text-violet-700">
                <span class="bg-violet-50 border border-violet-100 px-3 py-1.5 rounded-full font-medium shadow-sm">{{ currentUser ? currentUser.username : '正在验证登录…' }}</span>
                <button @click="openMemory" class="md:hidden text-gray-500 hover:text-violet-600">记忆</button>
                <button @click="handleLogout" :disabled="isLoggingOut" class="md:hidden text-gray-500 hover:text-rose-600">退出</button>
              </div>
            </header>

            <!-- 消息区：flex-1 占满中间剩余高度；底部输入框不再 absolute 叠上来 -->
            <div ref="messagesScrollRef" @scroll.passive="onMessageScroll" @wheel.passive="onMessageWheel" class="flex-1 min-h-0 overflow-y-auto p-4 sm:p-8">
              <div class="max-w-4xl mx-auto space-y-8 pb-4">
                <div v-if="!messages.length" class="text-center text-gray-400 text-sm pt-24">
                  输入问题开始对话
                </div>

                <div
                  v-for="msg in messages"
                  :key="msg.id"
                  class="flex"
                  :class="msg.role === 'user' ? 'justify-end' : 'justify-start'"
                >
                  <div
                    class="flex min-w-0 gap-2 sm:gap-4 max-w-[96%] sm:max-w-[85%]"
                    :class="msg.role === 'user' ? 'flex-row-reverse' : 'w-full'"
                  >
                    <div class="flex-shrink-0 mt-1">
                      <div
                        v-if="msg.role === 'user'"
                        class="w-10 h-10 rounded-full bg-white border border-gray-200 flex items-center justify-center text-gray-500 shadow-sm"
                      >
                        <icon-user class="w-5 h-5" />
                      </div>
                      <div
                        v-else
                        class="w-10 h-10 rounded-2xl bg-gradient-to-br from-violet-600 to-indigo-600 shadow-md flex items-center justify-center text-white"
                      >
                        <icon-brain class="w-6 h-6" />
                      </div>
                    </div>

                    <div
                      class="flex flex-col min-w-0"
                      :class="msg.role === 'user' ? 'items-end' : 'items-start flex-1'"
                    >
                      <!-- 实时与历史使用同一套步骤卡。 -->
                      <agent-blocks
                        v-if="msg.role === 'agent' && msg.blocks && (msg.blocks.length || (isGenerating && msg.id === lastMessageId))"
                        @inspect="inspectStep"
                        :blocks="msg.blocks"
                        :is-generating="isGenerating && msg.id === lastMessageId"
                        :render-markdown="renderMarkdown"
                        :markdown-ready="markdownReady"
                      />

                      <!-- 无过程数据的消息（用户消息 / 历史会话回放）：单气泡 -->
                      <div
                        v-if="msg.role !== 'agent' || !(msg.blocks && msg.blocks.length)"
                        v-show="msg.content"
                        class="px-6 py-4 rounded-[1.5rem] shadow-sm"
                        :class="msg.role === 'user'
                          ? 'bg-violet-600 text-white rounded-tr-sm shadow-violet-200'
                          : 'bg-white border border-gray-200 text-gray-800 rounded-tl-sm'"
                      >
                        <div
                          v-if="msg.role === 'agent' && markdownReady"
                          class="md-answer leading-relaxed text-[15px]"
                          v-html="renderMarkdown(msg.content)"
                        ></div>
                        <div v-else class="whitespace-pre-wrap leading-relaxed text-[15px]">{{ msg.content }}</div>
                      </div>
                    </div>
                  </div>
                </div>
                <div ref="messagesEndRef"></div>
              </div>
            </div>

            <div v-if="!following && messages.length" class="relative z-10">
              <button type="button" @click="goLatest" class="absolute bottom-2 left-1/2 -translate-x-1/2 bg-white shadow-md rounded-full border border-gray-200 px-4 py-1.5 text-sm text-violet-700">↓ 回到最新</button>
            </div>

            <!-- 输入区：占文档流底部，高度随内容变，消息区不会被挡住 -->
            <div class="flex-shrink-0 w-full border-t border-gray-200 bg-gray-50 px-4 pt-4 pb-6">
              <div class="max-w-4xl mx-auto relative flex flex-col items-center">
                <button
                  v-if="isGenerating"
                  @click="stopGeneration"
                  class="mb-4 flex items-center gap-2 bg-white border border-gray-200 shadow-md text-gray-600 hover:text-rose-600 hover:border-rose-200 px-5 py-2 rounded-full text-sm font-medium transition-all transform hover:scale-105"
                >
                  <icon-square class="w-4 h-4 fill-current" />
                  停止生成
                </button>

                <div class="w-full flex items-end gap-3">
                  <div
                    class="group relative flex-shrink-0 mb-1"
                    title="当前会话占模型上下文窗口的比例"
                  >
                    <div
                      class="w-14 h-14 rounded-full p-[5px] shadow-sm transition-all duration-500"
                      :style="contextRingStyle"
                    >
                      <div class="w-full h-full rounded-full bg-gray-50 flex flex-col items-center justify-center leading-none">
                        <span class="text-[11px] font-semibold text-gray-700">
                          {{ contextPercent.toFixed(0) }}%
                        </span>
                        <span class="text-[8px] mt-1 text-gray-400">上下文</span>
                      </div>
                    </div>
                    <div class="absolute bottom-full left-0 mb-2 hidden group-hover:block z-20 whitespace-nowrap rounded-lg bg-gray-900 px-3 py-2 text-[11px] text-white shadow-lg">
                      <template v-if="contextUsage.limit_tokens">
                        {{ compactTokens(contextUsage.used_tokens) }} /
                        {{ compactTokens(contextUsage.limit_tokens) }} token
                      </template>
                      <template v-else>
                        {{ compactTokens(contextUsage.used_tokens) }} token（分母未配置）
                      </template>
                    </div>
                  </div>

                  <div class="flex-1 relative flex items-end bg-white border border-gray-300 rounded-[1.5rem] shadow-lg focus-within:ring-4 focus-within:ring-violet-500/20 focus-within:border-violet-500 transition-all duration-300 overflow-hidden">
                  <textarea
                    ref="textareaRef"
                    v-model="inputValue"
                    @input="handleInput"
                    @keydown="handleKeyDown"
                    placeholder="输入问题，让 Agent 为您分析、编程或检索数据... (Shift+Enter 换行)"
                    class="w-full max-h-[240px] min-h-[60px] py-4 pl-6 pr-14 bg-transparent resize-none outline-none text-[15px] leading-relaxed text-gray-800 placeholder:text-gray-400"
                    rows="1"
                  ></textarea>
                  <div class="absolute right-3 bottom-2.5">
                    <button
                      @click="handleSend"
                      :disabled="!inputValue.trim() || isGenerating"
                      class="p-2.5 rounded-xl flex items-center justify-center transition-all duration-200"
                      :class="inputValue.trim() && !isGenerating
                        ? 'bg-violet-600 text-white shadow-md shadow-violet-200 hover:bg-violet-700 hover:scale-105'
                        : 'bg-gray-100 text-gray-400 cursor-not-allowed'"
                    >
                      <icon-send class="w-5 h-5" />
                    </button>
                  </div>
                  </div>
                </div>
                <div class="text-xs text-gray-400 mt-3 flex items-center gap-1.5">
                  <icon-brain class="w-3 h-3" />
                  Agent 可能会犯错。请核实关键信息。
                </div>
              </div>
            </div>
          </div>
        </div>
      `,
    };

    createApp({
      components: { ChatInterface },
      template: `<chat-interface />`,
    }).mount('#app');
  </script>
</body>
</html>
