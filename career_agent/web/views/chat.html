<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>对话 - Agent 工作台</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/vue@3.4.38/dist/vue.global.prod.js"></script>
  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
    .animate-spin { animation: spin 1s linear infinite; }
    .animate-pulse { animation: pulse 1.5s ease-in-out infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .animate-ping {
      animation: ping 1s cubic-bezier(0, 0, 0.2, 1) infinite;
    }
    @keyframes ping {
      75%, 100% { transform: scale(2); opacity: 0; }
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="app"></div>

  <!-- ?v= 用来打破浏览器对旧 shared.js 的缓存；改了图标就往上加一版 -->
  <script src="/shared.js?v=3"></script>
  <script>
    // ------------------------------------------------------------
    // 执行过程组件
    // 用法：<execution-steps :steps="msg.steps" :is-generating="true" />
    // ------------------------------------------------------------
    const ExecutionSteps = {
      components: { IconBrain, IconLoader, IconChevronDown, IconChevronRight },
      props: {
        steps: { type: Array, default: function () { return []; } },
        isGenerating: { type: Boolean, default: false },
      },
      setup() {
        const isExpanded = ref(true);
        return { isExpanded };
      },
      template: `
        <div
          v-if="steps && steps.length"
          class="mb-4 bg-gray-50/80 border border-gray-200 rounded-2xl overflow-hidden transition-all duration-300 w-full max-w-2xl shadow-sm"
        >
          <div
            class="flex items-center justify-between px-4 py-3 cursor-pointer hover:bg-gray-100/80 transition-colors"
            @click="isExpanded = !isExpanded"
          >
            <div class="flex items-center space-x-2 text-sm font-medium text-gray-700">
              <icon-brain class="w-4 h-4 text-violet-600" />
              <span>Agent 执行过程</span>
              <icon-loader v-if="isGenerating" class="w-3.5 h-3.5 animate-spin ml-2 text-gray-400" />
            </div>
            <icon-chevron-down v-if="isExpanded" class="w-4 h-4 text-gray-400" />
            <icon-chevron-right v-else class="w-4 h-4 text-gray-400" />
          </div>

          <div v-if="isExpanded" class="px-4 pb-4 pt-1 border-t border-gray-100/80 space-y-3">
            <div v-for="(step, idx) in steps" :key="idx" class="flex items-start space-x-3 text-sm">
              <div class="mt-0.5">
                <div
                  v-if="step.status === 'completed'"
                  class="w-4 h-4 rounded-full bg-emerald-100 flex items-center justify-center"
                >
                  <div class="w-1.5 h-1.5 rounded-full bg-emerald-500"></div>
                </div>
                <div
                  v-else-if="step.status === 'error'"
                  class="w-4 h-4 rounded-full bg-rose-100 flex items-center justify-center"
                >
                  <div class="w-1.5 h-1.5 rounded-full bg-rose-500"></div>
                </div>
                <icon-loader v-else class="w-4 h-4 animate-spin text-violet-500" />
              </div>
              <div class="flex-1">
                <span
                  class="font-medium"
                  :class="step.status === 'completed' ? 'text-gray-600' : 'text-gray-900'"
                >
                  {{ step.action }}
                </span>
                <p
                  v-if="step.detail"
                  class="text-gray-500 text-xs mt-1 font-mono whitespace-pre-wrap bg-white border border-gray-100 p-2 rounded-lg shadow-sm"
                >
                  {{ step.detail }}
                </p>
              </div>
            </div>
          </div>
        </div>
      `,
    };

    // ------------------------------------------------------------
    // 主聊天界面（无历史假数据、无模拟回复）
    // ------------------------------------------------------------
    const ChatInterface = {
      components: {
        ExecutionSteps,
        IconBrain,
        IconPlus,
        IconMessage,
        IconDatabase,
        IconLogOut,
        IconUser,
        IconSend,
        IconSquare,
        IconTrash,
      },
      setup() {
        const messages = ref([]);
        const currentUser = ref(null);
        const isLoggingOut = ref(false);
        const memoryVisible = ref(false);
        const memoryLoading = ref(false);
        const memorySaving = ref(false);
        const memoryLoaded = ref(false);
        const memoryEditing = ref(false);
        const memoryContent = ref('');
        const memoryDraft = ref('');
        const memoryRevision = ref('');
        const memoryUpdatedAt = ref(null);
        const memoryError = ref('');
        const memoryNotice = ref('');
        const memoryDialogRef = ref(null);
        const sessions = ref([]);
        const currentSessionId = ref(null);
        const contextUsage = ref({
          used_tokens: 0,
          limit_tokens: 16384,
          percent: 0,
        });
        const sessionError = ref('');
        const inputValue = ref('');
        const isGenerating = ref(false);
        const textareaRef = ref(null);
        const messagesEndRef = ref(null);
        // 真正滚动的是这个 overflow 容器，不是整页 window
        const messagesScrollRef = ref(null);

        const lastMessageId = computed(function () {
          const list = messages.value;
          return list.length ? list[list.length - 1].id : null;
        });

        const contextPercent = computed(function () {
          const percent = Number(contextUsage.value.percent || 0);
          return Math.max(0, Math.min(percent, 100));
        });

        const contextRingStyle = computed(function () {
          const percent = contextPercent.value;
          const color = percent >= 85
            ? '#e11d48'
            : percent >= 65
              ? '#d97706'
              : '#7c3aed';
          return {
            background: 'conic-gradient('
              + color
              + ' '
              + percent
              + '%, #e5e7eb '
              + percent
              + '% 100%)',
          };
        });

        function compactTokens(value) {
          const tokens = Number(value || 0);
          if (tokens >= 1000) {
            return (tokens / 1000).toFixed(tokens >= 10000 ? 0 : 1) + 'K';
          }
          return String(tokens);
        }

        function resetContextUsage() {
          contextUsage.value = {
            used_tokens: 0,
            limit_tokens: 16384,
            percent: 0,
          };
        }

        // instant=true：打开会话时立刻跳到底；false：流式追加时平滑滚
        function scrollToBottom(instant) {
          nextTick(function () {
            const container = messagesScrollRef.value;
            if (!container) return;
            function jump() {
              container.scrollTop = container.scrollHeight;
            }
            // 再等两帧，确保消息 DOM 已画完，scrollHeight 才是最终高度
            requestAnimationFrame(function () {
              requestAnimationFrame(function () {
                if (instant) {
                  jump();
                } else {
                  container.scrollTo({
                    top: container.scrollHeight,
                    behavior: 'smooth',
                  });
                }
              });
            });
          });
        }

        watch(messages, function () {
          scrollToBottom(false);
        }, { deep: true });

        function handleInput() {
          nextTick(function () {
            const el = textareaRef.value;
            if (!el) return;
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 200) + 'px';
          });
        }

        function handleKeyDown(e) {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            handleSend();
          }
        }

        function contentBlocks(content) {
          return content.split('```').map(function (block, i) {
            if (i % 2 !== 0) {
              return { type: 'code', text: block.replace(/^[a-z]+\n/, '') };
            }
            return { type: 'text', text: block };
          });
        }

        let activeRequest = null;

        async function responseJson(response) {
          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.detail || '请求失败');
          }
          return data;
        }

        async function loadSessions() {
          try {
            const response = await apiFetch('/api/sessions');
            sessions.value = await responseJson(response);
            sessionError.value = '';
          } catch (error) {
            sessionError.value = '会话列表加载失败：' + error.message;
          }
        }

        async function newSession() {
          if (activeRequest) {
            activeRequest.abort();
          }

          try {
            const response = await apiFetch('/api/sessions', {
              method: 'POST',
            });
            const session = await responseJson(response);
            currentSessionId.value = session.id;
            messages.value = [];
            resetContextUsage();
            isGenerating.value = false;
            sessionError.value = '';
            return session.id;
          } catch (error) {
            sessionError.value = '新建会话失败：' + error.message;
            return null;
          }
        }

        async function openSession(sessionId) {
          if (activeRequest) {
            activeRequest.abort();
          }

          try {
            const response = await apiFetch(
              '/api/sessions/' + encodeURIComponent(sessionId)
            );
            const session = await responseJson(response);
            const baseId = Date.now();
            messages.value = session.messages.map(function (message, index) {
              return {
                id: baseId + index,
                role: message.role,
                content: message.content,
                steps: [],
              };
            });
            currentSessionId.value = session.id;
            contextUsage.value = session.context_usage || {
              used_tokens: 0,
              limit_tokens: 16384,
              percent: 0,
            };
            isGenerating.value = false;
            sessionError.value = '';
            // 进入已有会话：立刻滚到最新消息，不要停在顶部
            scrollToBottom(true);
          } catch (error) {
            sessionError.value = '会话加载失败：' + error.message;
          }
        }

        async function removeSession(sessionId) {
          const confirmed = window.confirm('确认删除这个会话？');
          if (!confirmed) return;

          try {
            const response = await apiFetch(
              '/api/sessions/' + encodeURIComponent(sessionId),
              { method: 'DELETE' }
            );
            if (!response.ok) {
              const data = await response.json();
              throw new Error(data.detail || '删除失败');
            }

            if (currentSessionId.value === sessionId) {
              currentSessionId.value = null;
              messages.value = [];
              resetContextUsage();
            }
            await loadSessions();
          } catch (error) {
            sessionError.value = '会话删除失败：' + error.message;
          }
        }

        function parseSseBlock(block) {
          let eventName = 'message';
          const dataLines = [];

          block.split('\n').forEach(function (line) {
            if (line.startsWith('event:')) {
              eventName = line.slice(6).trim();
            } else if (line.startsWith('data:')) {
              dataLines.push(line.slice(5).trimStart());
            }
          });

          if (!dataLines.length) return null;
          return {
            name: eventName,
            data: JSON.parse(dataLines.join('\n')),
          };
        }

        // 发送问题：先把用户消息和空的 Agent 气泡放进列表，
        // 再请求 /api/chat/stream，按 SSE 事件把回答一点点拼上去。
        async function handleSend() {
          const text = inputValue.value.trim();
          // 空内容，或上一轮还在生成时，直接忽略
          if (!text || isGenerating.value) return;

          let sessionId = currentSessionId.value;
          if (!sessionId) {
            sessionId = await newSession();
            if (!sessionId) return;
          }

          // 用时间戳生成一对关联 id：用户消息 + 对应的 Agent 空气泡
          const requestId = Date.now();
          messages.value = messages.value.concat([
            { id: requestId, role: 'user', content: text },
            {
              id: requestId + 1,
              role: 'agent',
              content: '',
              steps: [],
            },
          ]);
          inputValue.value = '';
          isGenerating.value = true;
          // 发送后把输入框高度收回去
          if (textareaRef.value) {
            textareaRef.value.style.height = 'auto';
          }

          // AbortController 给"停止生成"用：点停止就 abort 这次 fetch
          activeRequest = new AbortController();

          try {
            // 会话编号放进 URL；后端会把本轮消息写入对应检查点
            const response = await apiFetch(
              '/api/sessions/'
                + encodeURIComponent(sessionId)
                + '/stream',
              {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ question: text }),
              signal: activeRequest.signal,
              }
            );

            // HTTP 层失败（4xx/5xx）：尽量读出 FastAPI 返回的 detail
            if (!response.ok) {
              const data = await response.json();
              throw new Error(data.detail || '请求失败');
            }

            // 找到刚才预置的那条空 Agent 消息，后面往它的 content 上追加
            const agentMessage = messages.value.find(function (msg) {
              return msg.id === requestId + 1;
            });
            if (!response.body) {
              throw new Error('浏览器无法读取流式响应');
            }

            // ReadableStream：一块一块读字节；decoder 转成字符串
            // buffer 用来拼不完整的 SSE 事件（可能被拆在两次 read 之间）
            const reader = response.body.getReader();
            const decoder = new TextDecoder('utf-8');
            let buffer = '';
            let streamFinished = false;

            while (!streamFinished) {
              const result = await reader.read();
              // stream: true 表示后面可能还有字节，避免把多字节汉字截断
              buffer += decoder.decode(result.value || new Uint8Array(), {
                stream: !result.done,
              });

              // SSE 协议：每个事件以空行（\n\n）分隔
              let separatorIndex = buffer.indexOf('\n\n');
              while (separatorIndex !== -1) {
                const block = buffer.slice(0, separatorIndex);
                buffer = buffer.slice(separatorIndex + 2);
                const event = parseSseBlock(block);

                // reasoning_delta：持续追加到同一个"模型思考"步骤
                if (event && event.name === 'reasoning_delta' && agentMessage) {
                  let reasoningStep = agentMessage.steps.find(function (step) {
                    return step.kind === 'reasoning';
                  });
                  if (!reasoningStep) {
                    reasoningStep = {
                      kind: 'reasoning',
                      action: '模型思考',
                      detail: '',
                      status: 'running',
                    };
                    agentMessage.steps.push(reasoningStep);
                  }
                  reasoningStep.detail += event.data.text || '';
                // tool_call：新增一条正在执行的工具步骤
                } else if (event && event.name === 'tool_call' && agentMessage) {
                  const argsText = event.data.args
                    ? JSON.stringify(event.data.args, null, 2)
                    : '';
                  agentMessage.steps.push({
                    kind: 'tool',
                    toolCallId: event.data.id || '',
                    action: '调用工具 ' + (event.data.name || '未知工具'),
                    detail: argsText,
                    status: 'running',
                  });
                // tool_result：找到对应工具步骤，补上结果并标记完成
                } else if (event && event.name === 'tool_result' && agentMessage) {
                  let toolStep = agentMessage.steps.find(function (step) {
                    return step.kind === 'tool'
                      && step.toolCallId === (event.data.id || '');
                  });
                  if (!toolStep) {
                    toolStep = {
                      kind: 'tool',
                      toolCallId: event.data.id || '',
                      action: '工具 ' + (event.data.name || '未知工具'),
                      detail: '',
                      status: 'running',
                    };
                    agentMessage.steps.push(toolStep);
                  }
                  const resultText = '返回：' + (event.data.result || '');
                  toolStep.detail = toolStep.detail
                    ? toolStep.detail + '\n' + resultText
                    : resultText;
                  toolStep.status = 'completed';
                // usage：只更新当前会话的上下文仪表，不加入问答执行步骤
                } else if (event && event.name === 'usage' && agentMessage) {
                  const inputTokens = Number(event.data.input_tokens || 0);
                  const outputTokens = Number(event.data.output_tokens || 0);
                  const limitTokens = Number(
                    event.data.limit_tokens
                      || contextUsage.value.limit_tokens
                      || 16384
                  );
                  const usedTokens = inputTokens + outputTokens;
                  contextUsage.value = {
                    used_tokens: usedTokens,
                    limit_tokens: limitTokens,
                    percent: event.data.context_percent !== undefined
                      ? Number(event.data.context_percent)
                      : usedTokens * 100 / limitTokens,
                  };
                // answer_delta：正文增量，拼到 Agent 气泡里
                } else if (event && event.name === 'answer_delta' && agentMessage) {
                  agentMessage.steps.forEach(function (step) {
                    if (step.status === 'running' && step.kind === 'reasoning') {
                      step.status = 'completed';
                    }
                  });
                  agentMessage.content += event.data.text || '';
                // error：服务端在流里报错
                } else if (event && event.name === 'error') {
                  if (agentMessage) {
                    agentMessage.steps.forEach(function (step) {
                      if (step.status === 'running') {
                        step.status = 'error';
                      }
                    });
                  }
                  throw new Error(event.data.message || '流式请求失败');
                // done：正常结束
                } else if (event && event.name === 'done') {
                  if (agentMessage) {
                    agentMessage.steps.forEach(function (step) {
                      if (step.status === 'running') {
                        step.status = 'completed';
                      }
                    });
                  }
                  streamFinished = true;
                  break;
                }

                separatorIndex = buffer.indexOf('\n\n');
              }

              // 底层流已关闭（即使没收到 done 也要退出循环）
              if (result.done) {
                streamFinished = true;
              }
            }
          } catch (error) {
            // 失败或用户点了停止：在 Agent 气泡里补一句说明
            const agentMessage = messages.value.find(function (msg) {
              return msg.id === requestId + 1;
            });
            if (agentMessage) {
              agentMessage.steps.forEach(function (step) {
                if (step.status === 'running') {
                  step.status = 'error';
                }
              });
              const message = error.name === 'AbortError'
                ? '已停止生成。'
                : '请求失败：' + error.message;
              agentMessage.content = agentMessage.content
                ? agentMessage.content + '\n\n' + message
                : message;
            }
          } finally {
            // 无论成功失败，都清掉控制器并恢复发送按钮
            activeRequest = null;
            isGenerating.value = false;
            await loadSessions();
          }
        }

        function stopGeneration() {
          if (activeRequest) {
            activeRequest.abort();
          }
          isGenerating.value = false;
        }

        function applyMemorySnapshot(data) {
          memoryContent.value = data.content;
          memoryDraft.value = data.content;
          memoryRevision.value = data.revision;
          memoryUpdatedAt.value = data.updated_at || null;
          memoryLoaded.value = true;
          memoryEditing.value = false;
        }

        function hasMemoryChanges() {
          return memoryEditing.value && memoryDraft.value !== memoryContent.value;
        }

        async function loadMemory() {
          if (memoryLoading.value || memorySaving.value) return;
          if (hasMemoryChanges() && !window.confirm('重新加载会丢弃未保存的修改，是否继续？')) return;
          memoryLoading.value = true;
          memoryError.value = '';
          memoryNotice.value = '';
          try {
            const response = await apiFetch('/api/memory');
            applyMemorySnapshot(await responseJson(response));
          } catch (error) {
            memoryError.value = error.message;
          } finally {
            memoryLoading.value = false;
          }
        }

        async function openMemory() {
          if (memoryLoading.value || memorySaving.value) return;
          memoryVisible.value = true;
          nextTick(function () {
            if (memoryDialogRef.value && !memoryDialogRef.value.open) {
              memoryDialogRef.value.showModal();
            }
          });
          await loadMemory();
        }

        function closeMemory() {
          if (memoryLoading.value || memorySaving.value) return;
          if (hasMemoryChanges() && !window.confirm('放弃尚未保存的记忆修改？')) return;
          if (memoryDialogRef.value) memoryDialogRef.value.close();
          memoryVisible.value = false;
          memoryDraft.value = memoryContent.value;
          memoryEditing.value = false;
        }

        function editMemory() {
          if (!memoryLoaded.value || memoryLoading.value || memorySaving.value) return;
          memoryEditing.value = true;
          memoryNotice.value = '';
        }

        function cancelMemoryEdit() {
          if (memoryLoading.value || memorySaving.value) return;
          memoryDraft.value = memoryContent.value;
          memoryEditing.value = false;
          memoryError.value = '';
        }

        async function saveMemory() {
          if (!memoryLoaded.value || !memoryEditing.value || memoryLoading.value || memorySaving.value) return;
          memorySaving.value = true;
          memoryError.value = '';
          memoryNotice.value = '';
          try {
            const response = await apiFetch('/api/memory', {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ content: memoryDraft.value, revision: memoryRevision.value }),
            });
            applyMemorySnapshot(await responseJson(response));
            memoryNotice.value = '已保存。建议新建会话使用最新记忆。';
          } catch (error) {
            memoryError.value = error.message;
          } finally {
            memorySaving.value = false;
          }
        }

        async function clearMemory() {
          if (!memoryLoaded.value || memoryLoading.value || memorySaving.value) return;
          if (!window.confirm('确认清空当前账号的长期记忆？将恢复空模板并丢弃未保存修改，不会删除历史聊天。')) return;
          memorySaving.value = true;
          memoryError.value = '';
          memoryNotice.value = '';
          try {
            const response = await apiFetch('/api/memory', {
              method: 'DELETE',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ revision: memoryRevision.value }),
            });
            applyMemorySnapshot(await responseJson(response));
            memoryNotice.value = '已清空并恢复空模板。建议新建会话继续。';
          } catch (error) {
            memoryError.value = error.message;
          } finally {
            memorySaving.value = false;
          }
        }

        function memoryTime(value) {
          return value ? new Date(value).toLocaleString() : '尚未保存';
        }

        async function initialize() {
          try {
            const response = await apiFetch('/api/auth/me');
            currentUser.value = await responseJson(response);
            await loadSessions();
          } catch (error) {
            sessionError.value = error.message;
          }
        }

        async function handleLogout() {
          if (isLoggingOut.value) return;
          isLoggingOut.value = true;
          if (activeRequest) activeRequest.abort();
          try {
            const response = await apiFetch('/api/auth/logout', { method: 'POST' });
            if (!response.ok) throw new Error('退出失败，请稍后重试');
            messages.value = [];
            sessions.value = [];
            currentUser.value = null;
            redirectToLogin(false);
          } catch (error) {
            sessionError.value = error.message;
          } finally {
            isLoggingOut.value = false;
          }
        }

        onMounted(initialize);

        return {
          messages,
          currentUser,
          isLoggingOut,
          handleLogout,
          memoryVisible,
          memoryLoading,
          memorySaving,
          memoryLoaded,
          memoryEditing,
          memoryContent,
          memoryDraft,
          memoryUpdatedAt,
          memoryError,
          memoryNotice,
          memoryDialogRef,
          openMemory,
          closeMemory,
          loadMemory,
          editMemory,
          cancelMemoryEdit,
          saveMemory,
          clearMemory,
          memoryTime,
          sessions,
          currentSessionId,
          contextUsage,
          contextPercent,
          contextRingStyle,
          sessionError,
          inputValue,
          isGenerating,
          textareaRef,
          messagesEndRef,
          messagesScrollRef,
          lastMessageId,
          handleInput,
          handleKeyDown,
          handleSend,
          stopGeneration,
          newSession,
          openSession,
          removeSession,
          contentBlocks,
          compactTokens,
        };
      },
      template: `

                <textarea

                  v-model="memoryDraft"

                  :disabled="memoryLoading || memorySaving"

            </div>

                    <span class="block truncate font-medium">{{ chat.title }}</span>
                    <span class="block mt-0.5 text-[11px] text-gray-400">{{ chat.message_count }} 条消息</span>

                </button>

                  <icon-trash class="w-4 h-4" />

                <icon-database class="w-4 h-4 text-gray-400 group-hover:text-violet-600 transition-colors" />
                <span class="font-medium group-hover:text-violet-900 transition-colors">记忆管理</span>
              </button>
              <button

                @click="handleLogout"
                :disabled="isLoggingOut"
                class="w-full flex items-center gap-3 px-3 py-3 rounded-xl hover:bg-rose-50 text-gray-500 hover:text-rose-600 text-sm transition-colors group"
              >
                <icon-log-out class="w-4 h-4 group-hover:text-rose-600 transition-colors" />
                <span class="font-medium">退出登录</span>
              </button>
            </div>
          </div>

          <div class="flex-1 flex flex-col h-full bg-gray-50 relative">
            <header class="h-16 border-b border-gray-200 flex items-center px-8 justify-between bg-white/60 backdrop-blur-md z-10">
              <div class="flex items-center gap-3">
                <div class="relative flex h-2.5 w-2.5">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
                </div>
                <span class="font-semibold text-gray-800 text-sm tracking-wide">Agent 工作台</span>

                <button @click="handleLogout" :disabled="isLoggingOut" class="md:hidden text-gray-500 hover:text-rose-600">退出</button>

                    :class="msg.role === 'user' ? 'flex-row-reverse' : ''"

                      <div
                        v-if="msg.role === 'user'"
                        class="w-10 h-10 rounded-full bg-white border border-gray-200 flex items-center justify-center text-gray-500 shadow-sm"
                      >
                        <icon-user class="w-5 h-5" />
                      </div>
                      <div
                        v-else
                        class="w-10 h-10 rounded-2xl bg-gradient-to-br from-violet-600 to-indigo-600 shadow-md flex items-center justify-center text-white"

                        <icon-brain class="w-6 h-6" />
                      </div>
                    </div>

                    <div
                      class="flex flex-col"
                      :class="msg.role === 'user' ? 'items-end' : 'items-start'"
                    >
                      <execution-steps

                      <div
                        v-if="msg.content"

                        <div class="whitespace-pre-wrap leading-relaxed text-[15px]">

                              </div>
                              <pre class="bg-gray-900 text-gray-50 p-4 overflow-x-auto text-sm font-mono leading-relaxed"><code>{{ block.text }}</code></pre>

                        </div>
                      </div>
                    </div>
                  </div>
                </div>
                <div ref="messagesEndRef"></div>

                >
                  <icon-square class="w-4 h-4 fill-current" />

                </button>

                <div class="w-full flex items-end gap-3">

                      class="w-14 h-14 rounded-full p-[5px] shadow-sm transition-all duration-500"

                    >
                      <div class="w-full h-full rounded-full bg-gray-50 flex flex-col items-center justify-center leading-none">
                        <span class="text-[11px] font-semibold text-gray-700">
                          {{ contextPercent.toFixed(0) }}%
                        </span>
                        <span class="text-[8px] mt-1 text-gray-400">上下文</span>
                      </div>
                    </div>
                    <div class="absolute bottom-full left-0 mb-2 hidden group-hover:block z-20 whitespace-nowrap rounded-lg bg-gray-900 px-3 py-2 text-[11px] text-white shadow-lg">
                      {{ compactTokens(contextUsage.used_tokens) }} /
                      {{ compactTokens(contextUsage.limit_tokens) }} token
                    </div>
                  </div>

                  <div class="flex-1 relative flex items-end bg-white border border-gray-300 rounded-[1.5rem] shadow-lg focus-within:ring-4 focus-within:ring-violet-500/20 focus-within:border-violet-500 transition-all duration-300 overflow-hidden">
                  <textarea
                    ref="textareaRef"
                    v-model="inputValue"
                    @input="handleInput"

                  ></textarea>
                  <div class="absolute right-3 bottom-2.5">
                    <button
                      @click="handleSend"
                      :disabled="!inputValue.trim() || isGenerating"
                      class="p-2.5 rounded-xl flex items-center justify-center transition-all duration-200"
                      :class="inputValue.trim() && !isGenerating
                        ? 'bg-violet-600 text-white shadow-md shadow-violet-200 hover:bg-violet-700 hover:scale-105'
                        : 'bg-gray-100 text-gray-400 cursor-not-allowed'"

                      <icon-send class="w-5 h-5" />
                    </button>
                  </div>
                  </div>
                </div>
                <div class="text-xs text-gray-400 mt-3 flex items-center gap-1.5">
                  <icon-brain class="w-3 h-3" />
                  Agent 可能会犯错。请核实关键信息。
                </div>
              </div>
            </div>
          </div>
        </div>
      `,
    };

    createApp({
      components: { ChatInterface },
      template: `<chat-interface />`,
    }).mount('#app');
  </script>
</body>
</html>
