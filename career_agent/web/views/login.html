<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 - 证书与职称咨询</title>
  <style>
    body { margin: 0; }
    ::selection { background: #ddd6fe; color: #1e1b4b; }
    .login-field { caret-color: #6d28d9; }
    .login-field::placeholder { color: #6b7280; }
    #boot-error, #style-error {
      display: none;
      box-sizing: border-box;
      margin: 1rem auto;
      max-width: 28rem;
      padding: 0.85rem 1rem;
      border-radius: 0.75rem;
      font: 14px/1.5 "Segoe UI", sans-serif;
    }
    #boot-error { border: 1px solid #fecdd3; background: #fff1f2; color: #9f1239; }
    #style-error { border: 1px solid #fde68a; background: #fffbeb; color: #92400e; }
    #boot-error.is-visible, #style-error.is-visible { display: block; }
  </style>
  <script src="/vendor/tailwind-browser.js?v=1" onerror="document.getElementById('style-error').classList.add('is-visible')"></script>
  <script src="/vendor/vue.global.prod.js?v=1"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <p id="style-error">样式没有加载完成，登录仍可使用。请刷新页面。</p>
  <p id="boot-error">页面没有加载完成，请刷新后再登录。</p>
  <div id="app"></div>

  <script src="/shared.js?v=4"></script>
  <script>
    if (!window.Vue || typeof createApp !== 'function') {
      document.getElementById('boot-error').classList.add('is-visible');
    } else {
    const LoginScreen = {
      components: { IconBrain, IconEye, IconEyeOff },
      setup() {
        const username = ref('');
        const password = ref('');
        const passwordError = ref('');
        const formError = ref('');
        const passwordVisible = ref(false);
        const isSubmitting = ref(false);
        const notice = ref(new URLSearchParams(window.location.search).has('expired')
          ? '登录已过期，请重新登录。' : '');

        function detailText(data) {
          return data && typeof data.detail === 'string' ? data.detail : '';
        }

        function showFailure(status, detail) {
          passwordError.value = '';
          formError.value = '';
          if (status === 401) {
            passwordError.value = '用户名或密码不正确。账号由管理员发放，忘记密码请联系管理员。';
            return;
          }
          if (status === 403) {
            formError.value = '这次登录被浏览器拦住了。请从本站页面重新打开后再试。';
            return;
          }
          if (status >= 500) {
            formError.value = '服务暂时不可用，登录没有完成。请稍后重试。';
            return;
          }
          formError.value = detail || '登录没有完成，请检查输入后重试。';
        }

        async function handleSubmit(e) {
          e.preventDefault();
          if (isSubmitting.value) return;
          passwordError.value = '';
          formError.value = '';
          isSubmitting.value = true;
          try {
            let response;
            try {
              response = await fetch('/api/auth/login', {
                method: 'POST',
                credentials: 'same-origin',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: username.value.trim(), password: password.value }),
              });
            } catch (error) {
              formError.value = '网络不通，登录没有提交。请检查连接后重试。';
              return;
            }
            let data = null;
            try {
              data = await response.json();
            } catch (error) {
              data = null;
            }
            if (!response.ok) {
              showFailure(response.status, detailText(data));
              return;
            }
            password.value = '';
            window.location.replace('/');
          } finally {
            isSubmitting.value = false;
          }
        }

        return {
          username, password, passwordError, formError, passwordVisible,
          isSubmitting, notice, handleSubmit,
        };
      },
      template: `
        <div class="flex items-center justify-center min-h-screen bg-gray-50 px-4 py-8">
          <div class="w-full max-w-md p-6 sm:p-10 space-y-8 bg-white rounded-[2rem] border border-gray-100 shadow-[0_18px_40px_-24px_rgba(15,23,42,0.45)]">
            <div class="text-center">
              <div class="flex items-center justify-center w-14 h-14 mx-auto mb-6 text-white bg-gradient-to-br from-violet-600 to-indigo-700 rounded-2xl">
                <icon-brain class="w-7 h-7" />
              </div>
              <h1 class="text-2xl font-bold tracking-tight text-gray-900 text-balance">证书与职称咨询</h1>
              <p class="mt-2 text-sm text-gray-600">登录后可以继续问政策、申报条件和报销流程。</p>
            </div>

            <form @submit="handleSubmit" class="space-y-5">
              <p v-if="notice" class="text-sm text-amber-800" role="status">{{ notice }}</p>
              <p v-if="formError" class="text-sm text-rose-700" role="alert">{{ formError }}</p>
              <div class="space-y-4">
                <div>
                  <label for="username" class="block mb-1.5 text-sm font-medium text-gray-700">用户名</label>
                  <input
                    id="username"
                    v-model="username"
                    type="text"
                    maxlength="64"
                    required
                    autocomplete="username"
                    class="login-field w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl outline-none transition-all duration-200 focus:bg-white focus:border-violet-600 focus:ring-2 focus:ring-violet-500"
                    placeholder="请输入用户名"
                  />
                </div>
                <div>
                  <label for="password" class="block mb-1.5 text-sm font-medium text-gray-700">密码</label>
                  <div class="relative">
                    <input
                      id="password"
                      v-model="password"
                      :type="passwordVisible ? 'text' : 'password'"
                      maxlength="128"
                      required
                      autocomplete="current-password"
                      :aria-invalid="passwordError ? 'true' : 'false'"
                      :aria-describedby="passwordError ? 'password-error account-help' : 'account-help'"
                      class="login-field w-full py-3 pl-4 pr-12 bg-gray-50 border border-gray-200 rounded-xl outline-none transition-all duration-200 focus:bg-white focus:border-violet-600 focus:ring-2 focus:ring-violet-500"
                      placeholder="请输入密码"
                    />
                    <button
                      type="button"
                      class="absolute top-1/2 right-2 flex items-center justify-center w-10 h-10 -translate-y-1/2 text-gray-600 rounded-lg hover:text-violet-700 focus:outline-none focus:ring-2 focus:ring-violet-500"
                      :aria-pressed="passwordVisible"
                      :aria-label="passwordVisible ? '隐藏密码' : '显示密码'"
                      @click="passwordVisible = !passwordVisible"
                    >
                      <icon-eye-off v-if="passwordVisible" class="w-5 h-5" />
                      <icon-eye v-else class="w-5 h-5" />
                    </button>
                  </div>
                  <p id="account-help" class="mt-2 text-sm text-gray-600">账号由管理员发放。忘记密码请联系管理员。</p>
                  <p v-if="passwordError" id="password-error" class="mt-2 text-sm text-rose-700" role="alert">{{ passwordError }}</p>
                </div>
              </div>

              <button
                type="submit"
                :disabled="isSubmitting"
                class="flex items-center justify-center w-full px-4 py-3 mt-4 text-sm font-medium text-white bg-violet-600 rounded-xl shadow-[0_6px_16px_-6px_rgba(76,29,149,0.55)] transition-all duration-200 hover:bg-violet-700 focus:outline-none focus:ring-2 focus:ring-violet-600 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-wait"
              >
                {{ isSubmitting ? '登录中…' : '登录' }}
              </button>
            </form>
          </div>
        </div>
      `,
    };

    createApp({
      components: { LoginScreen },
      template: `<login-screen />`,
    }).mount('#app');
    }
  </script>
</body>
</html>
