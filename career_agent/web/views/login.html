<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 - Agent 工作台</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/vue@3.4.38/dist/vue.global.prod.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="app"></div>

  <script src="/shared.js?v=3"></script>
  <script>
    const LoginScreen = {
      components: { IconBrain },
      setup() {
        const username = ref('');
        const password = ref('');
        const errorMessage = ref('');
        const isSubmitting = ref(false);
        const notice = ref(new URLSearchParams(window.location.search).has('expired')
          ? '登录已过期，请重新登录。' : '');

        async function handleSubmit(e) {
          e.preventDefault();
          if (isSubmitting.value) return;
          errorMessage.value = '';
          isSubmitting.value = true;
          try {
            const response = await fetch('/api/auth/login', {
              method: 'POST',
              credentials: 'same-origin',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ username: username.value.trim(), password: password.value }),
            });
            const data = await response.json();
            if (!response.ok) {
              throw new Error(typeof data.detail === 'string' ? data.detail : '登录失败，请检查输入');
            }
            password.value = '';
            window.location.replace('/');
          } catch (error) {
            errorMessage.value = error.message || '登录失败，请稍后重试';
          } finally {
            isSubmitting.value = false;
          }
        }

        return { username, password, errorMessage, isSubmitting, notice, handleSubmit };
      },
      template: `
        <div class="flex items-center justify-center min-h-screen bg-gray-50">
          <div class="w-full max-w-md p-10 space-y-8 bg-white shadow-2xl rounded-[2rem] border border-gray-100">
            <div class="text-center">
              <div class="flex items-center justify-center w-14 h-14 mx-auto bg-gradient-to-br from-violet-600 to-indigo-700 rounded-2xl mb-6 text-white shadow-lg shadow-violet-200">
                <icon-brain class="w-7 h-7" />
              </div>
              <h2 class="text-2xl font-bold tracking-tight text-gray-900">欢迎回来</h2>
              <p class="text-gray-500 mt-2 text-sm">登录您的 Agent 工作台</p>
            </div>

            <form @submit="handleSubmit" class="space-y-5">
              <p v-if="notice" class="text-sm text-amber-700" role="status">{{ notice }}</p>
              <p v-if="errorMessage" class="text-sm text-rose-600" role="alert">{{ errorMessage }}</p>
              <div class="space-y-4">
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1.5">用户名</label>
                  <input
                    v-model="username"
                    type="text"
                    maxlength="64"
                    required
                    autocomplete="username"
                    class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-violet-500 focus:bg-white focus:border-transparent outline-none transition-all duration-200"
                    placeholder="请输入您的用户名"
                  />
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1.5">密码</label>
                  <input
                    v-model="password"
                    type="password"
                    maxlength="128"
                    required
                    autocomplete="current-password"
                    class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-violet-500 focus:bg-white focus:border-transparent outline-none transition-all duration-200"
                    placeholder="••••••••"
                  />
                </div>
              </div>

              <button
                type="submit"
                :disabled="isSubmitting"
                class="w-full flex items-center justify-center py-3 px-4 rounded-xl shadow-md shadow-violet-200 text-sm font-medium text-white bg-violet-600 hover:bg-violet-700 disabled:opacity-50 disabled:cursor-wait focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-violet-600 transition-all duration-200 mt-4"
              >
                {{ isSubmitting ? '登录中…' : '登录' }}
              </button>
            </form>
          </div>
        </div>
      `,
    };

    createApp({
      components: { LoginScreen },
      template: `<login-screen />`,
    }).mount('#app');
  </script>
</body>
</html>
